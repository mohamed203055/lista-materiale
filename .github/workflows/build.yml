name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Protect JS (obfuscate)
        run: |
          cd app/src/main/assets
          sed -i 's#<script src="catalog.js"></script>#<script>window.LM_RELEASE=1</script>\n<script src="catalog.js"></script>#' index.html
          # dati (cataloghi, testi): nomi e stringhe nascosti
          for f in catalog.js packs.js trades.js lang.js; do
            npx --yes javascript-obfuscator@4.1.1 "$f" --output "$f" \
              --compact true --string-array true --string-array-encoding base64 \
              --string-array-threshold 1 --identifier-names-generator hexadecimal \
              --rename-globals false --self-defending false
          done
          # logica dell'app: protezione forte (flusso confuso, auto-difesa se viene formattato o modificato)
          npx --yes javascript-obfuscator@4.1.1 app.js --output app.js \
            --compact true --identifier-names-generator hexadecimal --rename-globals false \
            --string-array true --string-array-encoding base64 --string-array-threshold 1 \
            --string-array-rotate true --string-array-shuffle true \
            --string-array-wrappers-count 2 --string-array-wrappers-type function \
            --split-strings true --split-strings-chunk-length 8 \
            --control-flow-flattening true --control-flow-flattening-threshold 0.3 \
            --dead-code-injection true --dead-code-injection-threshold 0.1 \
            --transform-object-keys true --numbers-to-expressions true \
            --self-defending true --disable-console-output false
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp app.js "$GITHUB_WORKSPACE/out/web-app.js"
          cp catalog.js "$GITHUB_WORKSPACE/out/web-catalog.js"
          cp lang.js "$GITHUB_WORKSPACE/out/web-lang.js"
          cp packs.js "$GITHUB_WORKSPACE/out/web-packs.js"
          cp trades.js "$GITHUB_WORKSPACE/out/web-trades.js"
          head -c 200 app.js

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: Mat3r1aleK3y2026
          KEY_ALIAS: materiale
        run: |
          export KEYSTORE_FILE="$GITHUB_WORKSPACE/signing/release.jks"
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong" -A3 build.log | head -80 || true

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/TalabMawad-1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: طلب مواد 1.0.${{ github.run_number }}
          make_latest: true
          files: |
            out/*.apk
            out/web-app.js
            out/web-catalog.js
            out/web-lang.js
            out/web-packs.js
            out/web-trades.js
