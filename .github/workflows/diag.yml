name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://siteneeds.net/" "https://siteneeds.net/SiteNeeds.apk" "https://siteneeds.net/admin.html" "https://www.siteneeds.net/" "https://mohamed203055.github.io/lista-materiale-web/version.json?t=$RANDOM"; do
            a=$(curl -sSI -H "Origin: null" "$u" | tr -d '\r' | grep -iE "^HTTP|^location|^access-control|^content-length" | tr '\n' ' ')
            echo "::notice::$u => $a"
          done
          t=$(curl -sS https://siteneeds.net/ | grep -o "<title>[^<]*")
          echo "::notice::TITLE $t"
