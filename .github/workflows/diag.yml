name: diag
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - run: |
          a=$(curl -sSI -H "Origin: null" "https://mohamed203055.github.io/lista-materiale-web/version.json?t=$RANDOM" | tr -d '\r' | grep -iE "^HTTP|^location|^access-control" | tr '\n' ' ')
          echo "::notice::OLD $a"
          b=$(curl -sS "https://mohamed203055.github.io/lista-materiale-web/version.json?t=$RANDOM" | python3 -c "import json,sys;v=json.load(sys.stdin);print(v['versionCode'],v['apk'],v['live']['ver'])")
          echo "::notice::DATA $b"
