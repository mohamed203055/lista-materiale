name: dxfcheck
on:
  push:
    branches: [diag]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          pip install ezdxf >/dev/null
          python3 - <<'PY'
          import ezdxf
          from ezdxf import recover
          d,aud=recover.readfile('test.dxf')
          msp=d.modelspace()
          from collections import Counter
          print('::notice::DXF',d.dxfversion,dict(Counter(e.dxftype() for e in msp)),'layers',sorted(l.dxf.name for l in d.layers),'errors',len(aud.errors),'fixes',len(aud.fixes))
          d2=ezdxf.readfile('test.dxf');print('::notice::strict-read OK',len(list(d2.modelspace())))
          PY
